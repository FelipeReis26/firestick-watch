<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Firestick">
<title>Firestick Watch</title>
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<style>
:root{--ink:#1a1f1c;--paper:#eef0ea;--card:#fff;--line:#d9dbd2;--muted:#8a8577;--sub:#55584f;--fg:#1D9E75;--bg:#5DCAA5;--awake:#9FE1CB;--standby:#b4b2a9;--down:#E24B4A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:100%;max-width:440px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 22px 22px;position:relative}
.gear{position:absolute;top:14px;right:14px;background:none;border:0;color:var(--muted);line-height:1;cursor:pointer;padding:6px}
.hero{text-align:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 14px;transition:background .4s}
.word{font-size:32px;font-weight:500;line-height:1.1}
.since{font-size:14px;color:var(--sub);margin-top:6px}
.check{display:block;margin:18px auto 0;font:inherit;font-size:13px;padding:8px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.check:disabled{color:var(--muted)}
.strip{display:flex;gap:3px;height:28px;margin-top:28px}
.strip div{flex:1;border-radius:2px;background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:11px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stats{display:flex;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.stat{flex:1;text-align:center}
.stat b{display:block;font-size:20px;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.settings{display:none;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-size:14px}
.settings.open{display:block}
.settings label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.settings input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfbf8;color:var(--ink);margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.b{font:inherit;font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button.b.sec{background:transparent;color:var(--ink)}
.msg{font-size:12px;color:var(--muted);margin-top:10px;min-height:1em}
</style>
</head>
<body>
<div class="panel">
<div class="card">
<button class="gear" id="gear" aria-label="Settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
<div class="hero">
<div class="dot" id="dot"></div>
<div class="word" id="word">Waiting</div>
<div class="since" id="since">No reports yet</div>
<button class="check" id="check">Check now</button>
</div>
<div class="strip" id="strip"></div>
<div class="axis"><span>12h ago</span><span>now</span></div>
<div class="legend">
<span><i style="background:var(--fg)"></i>App on screen</span>
<span><i style="background:var(--bg)"></i>App in background</span>
<span><i style="background:var(--awake)"></i>Awake, app closed</span>
<span><i style="background:var(--standby)"></i>Standby</span>
<span><i style="background:var(--down)"></i>Unreachable</span>
</div>
<div class="stats">
<div class="stat"><b id="awakePct">–</b><span>awake in 12h</span></div>
<div class="stat"><b id="appPct">–</b><span>app on screen</span></div>
<div class="stat"><b id="ago">–</b><span>last check</span></div>
</div>
</div>
<div class="settings" id="settings">
<label for="topic">ntfy topic</label>
<input id="topic" type="text" placeholder="Firestick-F-room1">
<button class="b" id="save">Use this topic</button>
<div class="row" style="margin-top:12px">
<button class="b sec" data-s="foreground">On screen</button>
<button class="b sec" data-s="background">Background</button>
<button class="b sec" data-s="awake">Awake</button>
<button class="b sec" data-s="standby">Standby</button>
<button class="b sec" data-s="unreachable">Unreachable</button>
</div>
<div class="msg" id="msg"></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const STATES={
foreground:{word:'App on screen',color:'var(--fg)'},
background:{word:'App in background',color:'var(--bg)'},
awake:{word:'Awake, app closed',color:'var(--awake)'},
standby:{word:'Standby',color:'var(--standby)'},
unreachable:{word:'Unreachable',color:'var(--down)'}
};
const ALIAS={online:'awake',offline:'unreachable',asleep:'standby',sleep:'standby',off:'unreachable'};
let topic=localStorage.getItem('firestickTopic')||'';
let checks=[];
$('topic').value=topic;
$('gear').onclick=()=>$('settings').classList.toggle('open');
const BARS=48;
function fmt(d){return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function rel(ms){const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.round(s/60);if(m<60)return m+' min';return Math.round(m/60)+'h'}
function render(){
const strip=$('strip');strip.innerHTML='';
const shown=checks.slice(-BARS);
for(let i=0;i<BARS;i++){
const d=document.createElement('div');
const c=shown[i-(BARS-shown.length)];
if(c){d.style.background=STATES[c.state].color;if(i!==BARS-1)d.style.opacity='.7'}
strip.appendChild(d);
}
if(!checks.length){$('dot').style.background='var(--line)';$('word').textContent='Waiting';$('since').textContent='No reports yet';$('awakePct').textContent='–';$('appPct').textContent='–';$('ago').textContent='–';return}
const last=checks[checks.length-1];
$('dot').style.background=STATES[last.state].color;
$('word').textContent=STATES[last.state].word;
let i=checks.length-1;while(i>0&&checks[i-1].state===last.state)i--;
$('since').textContent='since '+fmt(checks[i].t);
const awake=checks.filter(c=>c.state!=='standby'&&c.state!=='unreachable').length;
const fg=checks.filter(c=>c.state==='foreground').length;
$('awakePct').textContent=Math.round(awake/checks.length*100)+'%';
$('appPct').textContent=Math.round(fg/checks.length*100)+'%';
tick();
}
function tick(){if(checks.length)$('ago').textContent=rel(Date.now()-checks[checks.length-1].t)+' ago'}
setInterval(tick,1000);
async function poll(){
if(!topic){$('msg').textContent='Set a topic to start';return}
try{
const r=await fetch('https://ntfy.sh/'+encodeURIComponent(topic)+'/json?poll=1&since=12h');
const lines=(await r.text()).trim().split('\n').filter(Boolean);
checks=lines.map(l=>{try{return JSON.parse(l)}catch(e){return null}})
.filter(m=>m&&m.event==='message')
.map(m=>{let s=(m.message||'').trim().toLowerCase();s=ALIAS[s]||s;return{state:s,t:new Date(m.time*1000)}})
.filter(c=>STATES[c.state])
.sort((a,b)=>a.t-b.t);
$('msg').textContent=checks.length?'':'No messages in the last 12 hours';
render();
}catch(e){$('msg').textContent='Could not reach ntfy.sh'}
}
$('save').onclick=()=>{topic=$('topic').value.trim();localStorage.setItem('firestickTopic',topic);checks=[];render();poll()};
async function send(s){if(!topic){$('msg').textContent='Set a topic first';return}
try{await fetch('https://ntfy.sh/'+encodeURIComponent(topic),{method:'POST',body:s});setTimeout(poll,800)}catch(e){$('msg').textContent='Could not send'}}
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>send(b.dataset.s));
$('check').onclick=async()=>{
if(!topic)return;
const btn=$('check');const before=checks.length?checks[checks.length-1].t.getTime():0;
btn.disabled=true;btn.textContent='Checking…';
try{await fetch('https://ntfy.sh/'+encodeURIComponent(topic)+'-cmd',{method:'POST',body:'check'})}catch(e){}
const start=Date.now();
const fast=setInterval(async()=>{
await poll();
const latest=checks.length?checks[checks.length-1].t.getTime():0;
if(latest>before||Date.now()-start>20000){clearInterval(fast);btn.disabled=false;btn.textContent=latest>before?'Check now':'No reply, try again'}
},1500);
};
if(!topic)$('settings').classList.add('open');
poll();setInterval(poll,15000);
</script>
</body>
</html>
